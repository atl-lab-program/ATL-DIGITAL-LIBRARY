<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comprehensive Guide For Diabetes, Symptoms &amp;Age Of Onset</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      color: #222;
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }   
/* Audio Controls Styling */
    .audio-bar {
      position: sticky;
      top: 10px;
      background: #f8f9fa;
      border: 1px solid #ddd;
      padding: 12px 16px;
      border-radius: 8px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      z-index: 100;
    }
    .audio-bar button {
      background-color: #b71c1c;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }
    .audio-bar button:hover {
      background-color: #8e0000;
    }
    .audio-bar button.secondary {
      background-color: #555;
    }
    .audio-bar button.secondary:hover {
      background-color: #333;
    }
    .audio-bar select {
      padding: 7px;
      border-radius: 5px;
      border: 1px solid #ccc;
      max-width: 200px;
    }
    /* Highlight Styling for Active Word */
    .spoken-word {
      border-radius: 3px;
      transition: background-color 0.1s ease;
    }
    .spoken-word.active-highlight {
      background-color: #ffeb3b;
      color: #000;
      box-shadow: 0 0 0 2px #ffeb3b;
    }
    <!-- Audio Reader Control Bar -->
  <div class="audio-bar">
    <span><strong>Listen to Page:</strong></span>
    <button onclick="playAudio()">▶ Read Aloud</button>
    <button class="secondary" onclick="pauseAudio()">⏸ Pause</button>
    <button class="secondary" onclick="stopAudio()">⏹ Stop</button>
    
    <label for="voiceSelect">Voice:</label>
    <select id="voiceSelect"></select>

    <label for="rate">Speed:</label>
    <select id="rate" onchange="changeSpeed()">
      <option value="0.8">0.8x</option>
      <option value="1" selected>1.0x (Normal)</option>
      <option value="1.25">1.25x</option>
      <option value="1.5">1.5x</option>
    </select>
  </div>
