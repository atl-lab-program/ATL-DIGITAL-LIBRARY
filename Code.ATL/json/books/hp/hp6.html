<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Harry-potter-6</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <style>
        body {
            background: #ffffff;
            background: linear-gradient(0deg,rgba(242, 230, 206, 1) 0%, rgba(223, 230, 233, 1) 50%, rgba(212, 230, 241, 1) 100%);;
            min-height: 100vh;
            margin: 0;
            padding-bottom: 50px;
        }

        h1 {
            text-align: center;
            font-size: 50px;
            font-weight: bold;
            font-family: 'papyrus', sans-serif;
            color: #222222;
            margin-top: 30px;
        }

        h2 {
            text-align: center;
            font-size: 25px;
            font-weight: bold;
            font-family: 'papyrus', sans-serif;
        }

        .cover-container {
            text-align: center;
        }

        .cover-container img {
            height: 472.44px;
            width: 321.26px;
            border-radius: 7px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        p {
            text-align: center;
            font-size: 23px;
            font-weight: bold;
            font-family: 'papyrus', sans-serif;
            max-width: 800px;
            margin: 20px auto;
            line-height: 1.5;
        }

        .image-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 10px 0;
            flex-wrap: wrap;
        }

        .image-row a img {
            width: 200px;
            height: 300px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .image-row a:hover img {
            transform: scale(1.04) translateY(-3px);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.25);
            cursor: pointer;
        }

        .home {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 30px;
        }

        .btn {
            background-color: rgb(41, 145, 0);
            color: white;
            border: none;
            height: 35px;
            width: 150px;
            border-radius: 5px;
            font-family: inherit;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .btn:hover {
            background-color: rgb(22, 77, 0);
            transform: scale(1.03);
        }
    </style>
</head>

<body>

    <h1>Harry-potter-6</h1>

    <div class="cover-container">
        <img src="/assets/images/hp/hp6.jpg" alt="Harry-potter-6">
    </div>

    <p>Dumbledore returns with a mysterious injury to guide Harry through Voldemort's past <br> as threats loom over Hogwarts, with Harry suspecting Malfoy is a Death Eater. <br> The story focuses on exploring the Dark Lord's to prepare for the final conflict.</p>

    <h2>Books in the series</h2>

    <div class="image-row">
        
        <a href="/json/books/hp/hp1.html"><img src="/assets/images/hp/hp1.jpg" alt="Book 2" class="a1"></a>
        <a href="/json/books/hp/hp2.html"><img src="/assets/images/hp/hp2.jpg" alt="Book 3" class="a2"></a>
        <a href="/json/books/hp/hp3.html"><img src="/assets/images/hp/hp3.jpg" alt="Book 4" class="a3"></a>
        <a href="/json/books/hp/hp4.html"><img src="/assets/images/hp/hp4.jpg" alt="Book 5" class="a4"></a>
        <a href="/json/books/hp/hp5.html"><img src="/assets/images/hp/hp5.jpg" alt="Book 6" class="a5"></a>
        <a href="/json/books/hp/hp7.html"><img src="/assets/images/hp/hp7.jpg" alt="Book 7" class="a6"></a>
    
    </div>

    <div class="home">
        <a href="/index.html">
            <button class="btn">Back to Home</button>
        </a>
    </div>

</body>

</html>
