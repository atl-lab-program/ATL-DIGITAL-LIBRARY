<!DOCTYPE html>

  <title>Book Library</title>
  <style>

    /*Background color*/
    body {
      background: linear-gradient(to bottom, rgb(250, 217, 191), rgb(166, 253, 163), rgb(164, 253, 249));
      background-repeat: no-repeat;
      min-height: 100vh;
      margin: 0px;
    }

    /*Styling of heading 1*/
    h1 {
      text-align: center;
      font-family: 'Gabriola', sans-serif;
      font-size: 75px;
      color: rgb(64, 1, 87);
      margin-bottom: 0;
    }

    /*Styling of heading 2*/
    h2 {
      text-align: center;
      font-family: 'Gabriola', sans-serif;
      font-size: 35px;
      color: rgb(64, 1, 87);
      margin-top: 0;
    }

    /*Styling of the search bar*/
    .search-container {
      display: flex;
      align-items: center;
      max-width: 400px;
      margin: 20px auto;
      border: 2px solid #e0e0e0;
      border-radius: 50px;
      padding: 6px 15px;
      background-color: #fff;
      transition: all 0.3s ease;
    }

    /*More styling of the search bar*/
    .search-container:focus-within {
      border-color: #007bff;
      box-shadow: 0 0 8px rgba(0, 123, 255, 0.2);
    }

    .search-container input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 16px;
      padding: 8px;
    }

    .search-container button {
      background: none;
      border: none;
      cursor: pointer;
      color: #666;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5px;
      transition: color 0.2s;
    }

    /*Hover controls of the search bar*/
    .search-container button:hover {
      color: #007bff;
    }

    /*Styling of the image row*/
    .image-side {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      padding: 20px;
    }


    .book-item {
      display: inline-block;
      text-decoration: none;
      border-radius: 5px;
    }

    .img {
      height: 300px;
      width: auto;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s;
    }

    .img:hover {
      transform: scale(1.05);
    }
  </style>
</head>

  <!-- JavaScript -->
  <script>
    document.getElementById('searchInput').addEventListener('keyup', function () {
      let filter = this.value.toLowerCase();
      // Select all book elements
      let items = document.querySelectorAll('.book-item');

      items.forEach(item => {
        // Get the image element inside the <a> tag
        let img = item.querySelector('img');
        // Get search text from the image's alt attribute or the link text
        let searchText = (img ? img.alt : item.textContent).toLowerCase();

        if (searchText.includes(filter)) {
          item.style.display = ""; // Show matching book
        } else {
          item.style.display = "none"; // Hide non-matching book
        }
      });
    });
  </script>
