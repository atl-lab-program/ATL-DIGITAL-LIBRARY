<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Book Library</title>
  <style>
    /*Background color*/
    body {
      background: linear-gradient(to bottom, rgb(250, 217, 191), rgb(166, 253, 163), rgb(164, 253, 249));
      background-repeat: no-repeat;
      min-height: 100vh;
      margin: 0px;
    }

    /*Styling of heading 1*/
    h1 {
      text-align: center;
      font-family: 'Gabriola', sans-serif;
      font-size: 75px;
      color: rgb(64, 1, 87);
      margin-bottom: 0;
    }

    /*Styling of heading 2*/
    h2 {
      text-align: center;
      font-family: 'Gabriola', sans-serif;
      font-size: 35px;
      color: rgb(64, 1, 87);
      margin-top: 0;
    }

    /*Styling of the search bar*/
    .search-container {
      display: flex;
      align-items: center;
      max-width: 400px;
      margin: 20px auto;
      border: 2px solid #e0e0e0;
      border-radius: 50px;
      padding: 6px 15px;
      background-color: #fff;
      transition: all 0.3s ease;
    }

    /*More styling of the search bar*/
    .search-container:focus-within {
      border-color: #007bff;
      box-shadow: 0 0 8px rgba(0, 123, 255, 0.2);
    }

    .search-container input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 16px;
      padding: 8px;
    }

    .search-container button {
      background: none;
      border: none;
      cursor: pointer;
      color: #666;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5px;
      transition: color 0.2s;
    }

    /*Hover controls of the search bar*/
    .search-container button:hover {
      color: #007bff;
    }

    /*Styling of the image row*/
    .image-side {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      padding: 20px;
    }

    /* All books in one container */
    .books-container {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 25px 15px;
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
      box-sizing: border-box;
      align-items: start;
    }

    .book-item {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
      min-width: 0;
      text-decoration: none;
      border-radius: 5px;
      box-sizing: border-box;
    }

    .img {
      display: block;
      width: 100%;
      max-width: 190px;
      height: auto;
      max-height: 300px;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s;
    }

    .img:hover {
      transform: scale(1.05);
    }

    /* Responsive layout */
    @media (max-width: 1000px) {
      .books-container {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 20px 15px;
      }
    }

    @media (max-width: 650px) {
      .books-container {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px 15px;
        padding: 15px;
      }

      .img {
        max-width: 180px;
      }
    }
  </style>
</head>

  <!-- JavaScript -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {

      const searchInput = document.getElementById("searchInput");
      const searchButton = document.getElementById("searchButton");
      const books = document.querySelectorAll(".book-item");

      if (!searchInput || books.length === 0) {
        return;
      }


      /* ================================
         GET BOOK NAME
         ================================ */

      function getBookName(book) {

        const img = book.querySelector("img");

        if (!img) {
          return "";
        }

        return (img.alt || "")
          .toLowerCase()
          .replace(/\s+/g, " ")
          .trim();
      }


      /* ================================
         FILTER BOOKS
         ================================ */

      function filterBooks() {

        const searchText = searchInput.value
          .toLowerCase()
          .replace(/\s+/g, " ")
          .trim();

        let matchingBooks = [];

        books.forEach(function (book) {

          const bookName = getBookName(book);

          if (
            searchText === "" ||
            bookName.includes(searchText)
          ) {

            book.style.display = "";
            matchingBooks.push(book);

          } else {

            book.style.display = "none";

          }

        });

        return matchingBooks;
      }


      /* ================================
         OPEN BOOK ONLY IF ONE MATCH
         ================================ */

      function openBookIfSingleMatch() {

        const searchText = searchInput.value
          .toLowerCase()
          .replace(/\s+/g, " ")
          .trim();

        if (searchText === "") {
          return;
        }

        const matchingBooks = filterBooks();


        /* ================================
           NO MATCHES
           ================================ */

        if (matchingBooks.length === 0) {

          showNoResults(searchText);

          return;
        }


        /* ================================
           MORE THAN ONE MATCH
           ================================ */

        if (matchingBooks.length > 1) {

          removeNoResults();

          return;
        }


        /* ================================
           EXACTLY ONE MATCH
           ================================ */

        const book = matchingBooks[0];

        const bookLink =
          book.getAttribute("href");

        if (bookLink) {

          window.location.href = bookLink;

        }
      }


      /* ================================
         NO RESULTS MESSAGE
         ================================ */

      function showNoResults(searchText) {

        let resultMessage =
          document.getElementById(
            "searchResultMessage"
          );

        if (!resultMessage) {

          resultMessage =
            document.createElement("div");

          resultMessage.id =
            "searchResultMessage";

          resultMessage.style.textAlign =
            "center";

          resultMessage.style.margin =
            "10px auto";

          resultMessage.style.fontSize =
            "16px";

          resultMessage.style.fontWeight =
            "500";

          searchInput
            .closest(".search-container")
            .after(resultMessage);
        }

        resultMessage.innerHTML =
          '❌ No book found for <strong>"' +
          searchText +
          '"</strong>';
      }


      /* ================================
         REMOVE NO RESULTS MESSAGE
         ================================ */

      function removeNoResults() {

        const resultMessage =
          document.getElementById(
            "searchResultMessage"
          );

        if (resultMessage) {

          resultMessage.remove();

        }
      }


      /* ================================
         SEARCH WHILE TYPING
         ================================ */

      searchInput.addEventListener(
        "input",
        function () {

          removeNoResults();

          filterBooks();

        }
      );


      /* ================================
         ENTER KEY
         ================================ */

      searchInput.addEventListener(
        "keydown",
        function (event) {

          if (event.key === "Enter") {

            event.preventDefault();

            openBookIfSingleMatch();

          }

        }
      );


      /* ================================
         SEARCH BUTTON
         ================================ */

      if (searchButton) {

        searchButton.addEventListener(
          "click",
          function (event) {

            event.preventDefault();

            openBookIfSingleMatch();

          }
        );

      }


      /* ================================
         ESCAPE KEY
         ================================ */

      searchInput.addEventListener(
        "keydown",
        function (event) {

          if (event.key === "Escape") {

            searchInput.value = "";

            removeNoResults();

            books.forEach(function (book) {

              book.style.display = "";

            });

          }

        }
      );

    });
  </script>
