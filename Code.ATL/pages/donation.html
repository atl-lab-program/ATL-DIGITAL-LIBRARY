<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donate</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: url('/assets/images/img2.png');
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: center 30%;
        }

        .form-container {
            background-color: rgba(0, 0, 0, 0.5);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            border: 1px solid rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(15px);
        }

        h1 {
            text-align: center;
            color: #fff;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 2rem;
        }

        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: bold;
            margin-bottom: 8px;
            color: #fff;
            font-size: 14px;
        }

        input[type="text"],
        input[type="password"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
            background-color: rgba(0, 0, 0, 0.5);
            color: white; /* Add this */
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        select:focus {
            border-color: #007bff;
        }

        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .password-wrapper input[type="password"],
        .password-wrapper input[type="text"] {
            padding-right: 60px;
        }

        .toggle-btn {
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            background: none;
            border: none;
            font-size: 13px;
            font-weight: bold;
            color: #007bff;
            padding: 8px 10px;
            transition: color 0.2s;
        }

        .toggle-btn:hover {
            color: #0056b3;
        }

        button[type="submit"] {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        button[type="submit"]:hover {
            background-color: #0056b3;
        }

        p {
            text-align: center;
            margin-top: 15px;
            color: #fff;
        }

        a {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }

        .home {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn {
            background-color: transparent;
            color: white;
            border: none;
            height: 35px;
            width: 150px;
            border-radius: 25px;
            transition: background-color 0.9s ease, transform 0.9s ease;
            border: 1px solid white;
            transform: 0.5s ease;
        }

        .btn:hover {
            background: white;
            color: black;
        }

        .book-name, .book-name1 {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        .book-name label, .book-name1 label, .tandc label {
            font-weight: bold;
            margin-bottom: 8px;
            color: #fff;
            font-size: 14px;
        }

        .tandc {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tandc label {
            margin-bottom: 0;
        }
    </style>
</head>

<body>

    <div class="form-container">
        <h1>Donation Form</h1>

        <form id="donationForm">
            <div class="form-group">
                <label for="full-name">Full Name</label>
                <input type="text" id="full-name" placeholder="Full Name" required>
            </div>

            <div class="form-group">
                <label for="grade">Grade</label>
                <select id="grade" required>
                    <option value="">Select Grade</option>
                    <option value="Grade 5">Grade 5</option>
                    <option value="Grade 6">Grade 6</option>
                    <option value="Grade 7">Grade 7</option>
                    <option value="Grade 8">Grade 8</option>
                    <option value="Grade 9">Grade 9</option>
                    <option value="Grade 10">Grade 10</option>
                </select>
            </div>

            <div class="form-group">
                <label for="passwordField">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="passwordField" placeholder="Enter password" required>
                    <button type="button" class="toggle-btn" id="toggleBtn" onclick="togglePassword()">Show</button>
                </div>
            </div>

            <div class="book-name">
                <label for="bookNameField">Book Name</label>
                <input id="bookNameField" type="text" placeholder="Please Enter Book Name Accurately" required>
            </div>

            <div class="book-name1">
                <label for="bookAuthorField">Book Author Name</label>
                <input id="bookAuthorField" type="text" placeholder="Please Enter Book Author Accurately" required>
            </div>

            <div class="book-name1">
                <label for="donationDateField">Date of donating book</label>
                <input id="donationDateField" type="text" placeholder="Format e.g - 1/1/2026" required>
            </div>

            <div class="tandc">
                <input type="checkbox" id="reading" name="hobby" value="reading_hobby" required>
                <label for="reading">I have read and agree to the <a href="tandc.html" target="_blank">Terms & Conditions</a>.</label>
            </div>

            <button type="submit">Donate</button>
            <br>
          
            <p>New User? .. <span><a href="/sections/auth/registration.html">Create Account</a></span></p>
            <br>
            <div class="home">
                <a href="/index.html" class="btn-a">
                    <button class="btn" type="button"> Back to Home </button>
                </a>
            </div>
        </form>
    </div>

    <script>
        // Toggle password visibility
        function togglePassword() {
            const pwdInput = document.getElementById("passwordField");
            const toggleBtn = document.getElementById("toggleBtn");
            if (pwdInput.type === "password") {
                pwdInput.type = "text";
                toggleBtn.textContent = "Hide";
            } else {
                pwdInput.type = "password";
                toggleBtn.textContent = "Show";
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            const fullNameInput = document.getElementById("full-name");
            const passwordInput = document.getElementById("passwordField");
            const dateInput = document.getElementById("donationDateField");
            const donationForm = document.getElementById("donationForm");

            // 1. Pre-fill existing Name and Password from Local Storage
            const savedName = localStorage.getItem("fullName");
            const savedPassword = localStorage.getItem("password");

            if (savedName) fullNameInput.value = savedName;
            if (savedPassword) passwordInput.value = savedPassword;

            // 2. Restrict Date Input to only numbers and '/'
            dateInput.addEventListener("input", (e) => {
                e.target.value = e.target.value.replace(/[^0-9/]/g, '');
            });

            // 3. Handle Form Submission with validations
            donationForm.addEventListener("submit", (e) => {
                e.preventDefault();

                const enteredPassword = passwordInput.value;
                const dateValue = dateInput.value;

                // Validate Password against localStorage if a password exists stored
                if (savedPassword && enteredPassword !== savedPassword) {
                    alert("Error: Incorrect password. Please try again.");
                    return; // Stop submission
                }

                // Validate Date Format (e.g., 1/1/2026 or 12/31/2026)
                const dateRegex = /^\d{1,2}\/\d{1,2}\/\d{4}$/;
                if (!dateRegex.test(dateValue)) {
                    alert("Error: Please enter a valid date format (e.g., 1/1/2026).");
                    return; // Stop submission
                }

                // Create donation data object
                const donationRecord = {
                    fullName: fullNameInput.value,
                    grade: document.getElementById("grade").value,
                    password: enteredPassword,
                    bookName: document.getElementById("bookNameField").value,
                    bookAuthor: document.getElementById("bookAuthorField").value,
                    donationDate: dateValue,
                    submittedAt: new Date().toLocaleString()
                };

                // Store details in localStorage
                localStorage.setItem("fullName", donationRecord.fullName);
                localStorage.setItem("password", donationRecord.password);

                let donationsList = JSON.parse(localStorage.getItem("donations")) || [];
                donationsList.push(donationRecord);
                localStorage.setItem("donations", JSON.stringify(donationsList));

                // Success Popup & Redirect
                alert("Donation successfully recorded!");
                window.location.href = "/index.html";
            });
        });
    </script>
</body>

</html>
